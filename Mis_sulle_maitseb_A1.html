const icons=['🗂️','📖','✏️','☕','💬'];
const names=['Sõnakaardid / Flashcards',...Object.keys(tasks)];
const states=Object.fromEntries(Object.keys(tasks).map(k=>[k,{i:0,missed:new Set(),order:tasks[k].map((_,i)=>i),done:false}]));
let tab=names[0],pack=Object.keys(packs)[0],index=0,revealed=false;
const panel=document.getElementById('panel'), nav=document.getElementById('nav');
const el=(id)=>document.getElementById(id);
const shuffle=(items)=>{const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy};
for(const name of names){const b=document.createElement('button');b.innerHTML='<span aria-hidden="true">'+icons[names.indexOf(name)]+'</span> '+name;b.onclick=()=>{tab=name;render();panel.querySelector('h2').focus()};nav.append(b)}
function render(){
 Array.from(nav.children).forEach((b,i)=>b.setAttribute('aria-current',names[i]===tab));
 panel.dataset.section=names.indexOf(tab);
 panel.innerHTML='<h2 tabindex="-1"><span aria-hidden="true">'+icons[names.indexOf(tab)]+'</span> '+tab+'</h2>';
 if(tab===names[0]){cards();return}
 quiz();
}
function cards(){
 const rows=packs[pack].split('\n'),[nom,gen,part,en]=rows[index].split('|');
 panel.insertAdjacentHTML('beforeend',`<p>Meenuta kolme vormi, siis pööra kaart ümber.<br><small>Say the three forms from memory, then flip the card. The second form is the base for -ga and -ta.</small></p>
 <label for="pack">Sõnapakk / Word deck</label><select id="pack">${Object.keys(packs).map(x=>'<option>'+x+'</option>').join('')}</select>
 <button id="flip" class="card" aria-pressed="${revealed}">${revealed?nom+' · '+gen+' · '+part:en}</button>
 <p class="muted">${index+1} / ${rows.length} · ${revealed?'Nimetav · omastav · osastav':'Pööra kaart / Flip card'}</p>
 ${revealed?'<p><strong>-ga:</strong> '+gen+'ga · <strong>-ta:</strong> '+gen+'ta</p>':''}
 <div class="row"><button id="prev">Eelmine / Back</button><button id="next">Järgmine / Next</button></div>`);
 el('pack').value=pack;el('pack').onchange=e=>{pack=e.target.value;index=0;revealed=false;render();el('pack').focus()};
 el('flip').onclick=()=>{revealed=!revealed;render();el('flip').focus()};
 el('prev').onclick=()=>{index=(index+rows.length-1)%rows.length;revealed=false;render();el('prev').focus()};
 el('next').onclick=()=>{index=(index+1)%rows.length;revealed=false;render();el('next').focus()};
}
function quiz(){
 const s=states[tab], items=tasks[tab];
 if(s.done){
 panel.insertAdjacentHTML('beforeend',`<p>Lahendatud / Completed: ${s.order.length}.</p><p>Proovi veel neid, mis vajasid harjutamist. / Retry the items you missed.</p><div class="row"><button id="retry" ${s.missed.size?'':'disabled'}>Korda (${s.missed.size}) / Retry</button><button id="restart">Kõik uuesti / Start over</button></div>`);
 const start=(order)=>{s.order=order;s.i=0;s.missed.clear();s.done=false;render();panel.querySelector('h2').focus()};
 el('retry').onclick=()=>start([...s.missed]);el('restart').onclick=()=>start(items.map((_,i)=>i));return}
 const idx=s.order[s.i], [question,answer,why,...other]=items[idx], translation=tab===names[4], typing=translation||!other.length;
 if(tab===names[1]){
 const shopping=idx>=5;
 panel.insertAdjacentHTML('beforeend', shopping?
 '<p>Loe ostunimekirja. / Read the shopping list.</p><blockquote><strong>Hommikusöögiks:</strong> sinki, vorsti, juustu, mineraalvett, apelsinimahla ja võid.<br><strong>Lõunaks:</strong> liha ja kartulit.<br><strong>Õhtusöögiks:</strong> õlut, makarone ja hakkliha.<br><strong>Lastele:</strong> piima, komme, keefirit ja küpsiseid.</blockquote>':
 '<p>Loe Imbi pere hommikusöögist. / Read about Imbi’s family breakfast.</p><blockquote>Imbi joob vett sidruniga ja kohvi kohvikoore ja suhkruga. Ta sööb võileiba vorstiga ja võisaia juustuga. Liina sööb pirni, kohukest ja moosisaia ning joob kakaod. Niklas sööb viinereid munaga ja salatit. Ta joob morssi või kalja. Jane sööb õuna, lõhevõileiba ja kooki. Talle maitseb piim.</blockquote>');
 }
 if(translation)panel.insertAdjacentHTML('beforeend','<p>Tõlgi lause eesti keelde. Alusta suure tähega ja pane lause lõppu sobiv kirjavahemärk.<br><small>Translate the sentence into Estonian. Start with a capital letter and add the correct punctuation mark at the end.</small></p>');
 if(typing&&!translation)panel.insertAdjacentHTML('beforeend','<p>Kirjuta puuduv sõna. / Type the missing word.</p><details><summary>Vihje / Hint</summary><p><strong>With → omastav + -ga</strong> (juustu + ga). <strong>Without → omastav + -ta</strong> (juustu + ta). <em>Mida?</em> pärast <em>ma ostan</em> ja sõna <em>kaks</em> → osastav. Üks asi <em>maitseb</em>, mitu asja <em>maitsevad</em>.</p></details>');
 if(tab===names[3])panel.insertAdjacentHTML('beforeend','<p>Vali sobiv tellimus. / Choose the order that matches the English.</p>');
 panel.insertAdjacentHTML('beforeend',`<p class="muted">${s.i+1} / ${s.order.length}</p><p id="question"><strong>${question}</strong></p><div id="answers" class="row"></div><div id="feedback" class="feedback" role="status"></div><button id="next" hidden>Edasi / Next</button>`);
 const normalize=(value)=>value.normalize('NFC').toLocaleLowerCase('et').replace(translation?/[,.!?]/g:/$^/g,' ').trim().replace(/\s+/g,' ');
 const accepted=translation?[answer,...other[0]]:[answer];
 const feedback=el('feedback');
 const check=(value,show=false)=>{
 const correct=accepted.some(option=>normalize(value)===normalize(option));
 if(!correct)s.missed.add(idx);
 const punctuationTip=translation&&correct&&(!/^\p{Lu}/u.test(value.trim())||!/[.!?]$/.test(value.trim()));
 feedback.dataset.result=correct?'correct':show?'shown':'incorrect';
 feedback.textContent=show?'Vastus / Answer: '+answer+' · '+why:correct?'Õige! / Correct! '+(punctuationTip?'Pea meeles suurt algustähte ja lõpumärki. / Remember the capital letter and final punctuation. ':'')+(translation?'Näidis / Model: '+answer:why):'Veel ei klapi. / Try again. '+(typing&&!translation?'Vaata vihjet või proovi teist vormi. / Use the hint or try another form.':'');
 if(correct||show){el('answers').querySelectorAll('button,input').forEach(b=>b.disabled=true);el('next').hidden=false;el('next').focus()}
 };
 if(typing){
 el('answers').innerHTML='<div class="entry-box"><input aria-labelledby="question" id="entry" autocomplete="off" spellcheck="false"><button id="check" type="button">Kontrolli / Check</button> <button id="show" type="button">Näita vastust / Show answer</button></div>';
 el('check').onclick=()=>{
 const entry=el('entry');
 if(!entry.value.trim()){feedback.textContent='Kirjuta kõigepealt vastus. / Enter an answer first.';entry.focus();return}
 check(entry.value);
 if(!entry.disabled)entry.focus();
 };
 el('entry').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();el('check').click()}};
 }else{
 for(const option of shuffle([answer,...other])){const b=document.createElement('button');b.textContent=option;b.onclick=()=>check(option);el('answers').append(b)}
 const b=document.createElement('button');b.textContent='Näita vastust / Show answer';b.id='show';el('answers').append(b);
 }
 el('show').onclick=()=>check('',true);
 el('next').onclick=()=>{s.i++;s.done=s.i===s.order.length;render();(el('question')||panel.querySelector('h2')).setAttribute('tabindex','-1');(el('question')||panel.querySelector('h2')).focus()};
}
render();
</script></html>
